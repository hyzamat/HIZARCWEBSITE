<!doctype html>
<html lang="en-AE" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HIZARC | IT Company in Dubai — Software, Websites, Games &amp; Cyber Security</title>
    <meta
      name="description"
      content="HIZARC is a Dubai-based IT company building custom web applications, software, websites and games — plus IT support, infrastructure design, cyber security and online marketing across the UAE &amp; GCC."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <link rel="canonical" href="__SITE_URL__/" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HIZARC" />
    <meta property="og:locale" content="en_AE" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="HIZARC — IT &amp; Software Solutions in Dubai" />
    <meta
      property="og:description"
      content="Custom web apps, software, websites, games, infrastructure, cyber security, IT support and online marketing — engineered in Dubai."
    />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="geo.region" content="AE-DU" />
    <meta name="geo.placename" content="Dubai" />
    <meta name="geo.position" content="25.2048;55.2708" />
    <meta name="ICBM" content="25.2048, 55.2708" />

    <!-- skip the intro animation for returning visitors in the same session -->
    <script>
      try { if (sessionStorage.getItem('hz-intro')) document.documentElement.classList.add('intro-seen') } catch (e) {}
    </script>
    <!-- visitors who picked Arabic (or opened a ?lang=ar link) wait a moment for the Arabic page instead of seeing English first -->
    <script>
      try {
        var hzLang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('hz-lang')
        if (hzLang === 'ar') document.documentElement.classList.add('lang-pending')
      } catch (e) {}
    </script>
    <noscript>
      <style>[style*="opacity:0"],[style*="translateY(110%)"]{opacity:1!important;transform:none!important}[aria-label="Illustrated Dubai skyline"] path{stroke-dasharray:none!important}.preloader{display:none!important}#story{height:auto!important}#story>div{position:static!important;height:auto!important}#story .scene{display:none}#story [class*="grid-area"]{grid-area:auto!important;margin-bottom:2rem}</style>
    </noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
